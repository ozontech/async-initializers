name: Publish Android Library to Maven Central

on:
  push:
    tags:
      - 'library-*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate version matches versions.properties
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#library-}"
          EXPECTED_VERSION=$(grep '^versionName=' library/versions.properties | sed 's/^versionName=//')
          if [ "$TAG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match versions.properties ($EXPECTED_VERSION)"
            exit 1
          fi
          echo "Version validated: $EXPECTED_VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks
        run: ./gradlew check --no-configuration-cache

      - name: Publish to Maven Central
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Build release AARs
        run: ./gradlew :library:assembleRelease --no-configuration-cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            library/build/outputs/aar/library-release.aar
